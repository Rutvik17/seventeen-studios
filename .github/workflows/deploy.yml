name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish a build by hand from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue the newest and let it win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `enablement: true` turns GitHub Pages on for the repository via the
      # Pages API if it is not already enabled, so no manual settings change
      # is needed for the first deploy.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build static site
        env:
          # Project pages are served from https://<user>.github.io/<repo>/,
          # so every asset and route needs the repository name prefix.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      # `_next/` starts with an underscore, which Jekyll would strip.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
