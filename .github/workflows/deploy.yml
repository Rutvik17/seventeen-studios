name: Deploy to GitHub Pages

# ONE-TIME SETUP REQUIRED
#
# Before the first successful run, enable Pages by hand:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# This cannot be automated from here. `actions/configure-pages` has an
# `enablement: true` option that calls the Pages API to create the site, but
# the workflow's automatic GITHUB_TOKEN is not permitted to do that — it fails
# with "Resource not accessible by integration". Creating a Pages site needs
# repository-administration rights that the automatic token deliberately does
# not have. So the site is created once by a human, and every deploy after that
# is automatic.
#
# Nothing below calls the Pages API for configuration: the base path is derived
# from the repository name, so the build never depends on that API being
# reachable or the token being privileged.

on:
  push:
    branches: [main]
  # Two things go stale in a static export and both are fixed by rebuilding.
  #
  # Calendar-derived copy — years of experience, the copyright line — is
  # computed at build time by `src/lib/time.ts` and freezes at the moment of
  # the build.
  #
  # Market data is the reason this is DAILY rather than monthly: `prebuild`
  # runs `scripts/fetch-market.mjs`, which pulls real closes for the risk desk.
  # 22:30 UTC is after the US close and its settlement, so the fetch picks up a
  # finished session rather than a partial one.
  schedule:
    - cron: '30 22 * * 1-5'
  # Lets you publish a build by hand from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions required by actions/deploy-pages, plus `write` so the
# build can commit the intraday archive back — see "Keep the intraday archive".
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once; queue the newest and let it win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Pages URLs
        id: paths
        run: |
          set -euo pipefail
          # From github.repository ("owner/repo"), which is present on every
          # event type — unlike github.event.repository, which depends on the
          # webhook payload and is not guaranteed on a schedule trigger.
          repo='${{ github.repository }}'
          repo=${repo#*/}
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')

          # A repository named <owner>.github.io is a user/organisation page and
          # is served from the domain root. Everything else is a project page
          # served from /<repo>, so assets and routes need that prefix.
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$repo" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$owner.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.site_url }}
        run: npm run build

      # The intraday archive only grows if somebody keeps it.
      #
      # Yahoo serves 60 days of 15-minute bars and refuses older windows
      # outright, so the history behind that wall cannot be fetched — but it can
      # be REMEMBERED. `fetch-sweep.mjs` merges each run into the committed file
      # rather than replacing it, so every weekday build adds the newest session
      # and nothing that has scrolled past 60 days is ever lost.
      #
      # Without this step the accumulator is thrown away with the runner and the
      # sample is permanently stuck at whatever Yahoo will still serve. With it,
      # the file grows by seven Mondays a week on its own.
      #
      # `[skip ci]` matters: the push would otherwise trigger this same workflow
      # and it would sit there rebuilding itself.
      - name: Keep the intraday archive
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          # Compare SESSION COUNTS, not bytes. The payload carries a `fetchedAt`
          # stamp that moves on every run, so a plain `git diff` is always dirty
          # and would commit on every build for no reason.
          grew=$(node -e '
            const { execSync } = require("node:child_process");
            const fs = require("node:fs");
            const count = (json) => {
              try {
                const d = JSON.parse(json);
                return (d.tickers ?? []).reduce(
                  (s, t) => s + Object.keys(t.fine ?? {}).length, 0);
              } catch { return -1; }
            };
            let before = -1;
            try {
              before = count(execSync("git show HEAD:src/content/sweep.json",
                { encoding: "utf8", maxBuffer: 64e6 }));
            } catch { before = -1; }
            const after = count(fs.readFileSync("src/content/sweep.json", "utf8"));
            console.error(`archive: ${before} -> ${after} sessions`);
            process.stdout.write(after > before ? "yes" : "no");
          ')

          if [ "$grew" != "yes" ]; then
            echo "nothing new to keep"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/sweep.json
          git commit -m 'chore: extend the intraday archive [skip ci]'

          # Keeping the archive must never cost a deploy. If main moved while
          # this build was running, rebase once and retry; if it still will not
          # go, say so and carry on — the sessions are re-fetchable tomorrow,
          # and a published site is not.
          git push || {
            git pull --rebase --autostash origin main && git push
          } || echo "::warning::archive push failed; the site still deploys"

      # `_next/` starts with an underscore, which Jekyll would strip.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If this step fails with a 404 or "not accessible", Pages has not been
      # enabled yet — see the note at the top of this file.
      - id: deployment
        uses: actions/deploy-pages@v4
