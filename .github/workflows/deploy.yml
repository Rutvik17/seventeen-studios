name: Deploy to GitHub Pages

# ONE-TIME SETUP REQUIRED
#
# Before the first successful run, enable Pages by hand:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# This cannot be automated from here. `actions/configure-pages` has an
# `enablement: true` option that calls the Pages API to create the site, but
# the workflow's automatic GITHUB_TOKEN is not permitted to do that — it fails
# with "Resource not accessible by integration". Creating a Pages site needs
# repository-administration rights that the automatic token deliberately does
# not have. So the site is created once by a human, and every deploy after that
# is automatic.
#
# Nothing below calls the Pages API for configuration: the base path is derived
# from the repository name, so the build never depends on that API being
# reachable or the token being privileged.

on:
  push:
    branches: [main]
  # Two things go stale in a static export and both are fixed by rebuilding.
  #
  # Calendar-derived copy — years of experience, the copyright line — is
  # computed at build time by `src/lib/time.ts` and freezes at the moment of
  # the build.
  #
  # Market data is the reason this is DAILY rather than monthly: `prebuild`
  # runs `scripts/fetch-market.mjs` for the risk desk and `alpha:data` for the
  # factor panel. 22:30 UTC is after the US close and its settlement, so the
  # fetch picks up a finished session rather than a partial one.
  schedule:
    - cron: '30 22 * * 1-5'
  # Lets you publish a build by hand from the Actions tab.
  workflow_dispatch:

# Exactly what actions/deploy-pages needs, and nothing more.
#
# This was `contents: write` for the intraday archive, which merged each run's
# fifteen-minute bars into a committed file and pushed it back — the only way to
# accumulate history behind Yahoo's 60-day wall. That strategy is gone and so is
# the accumulator: the factor panel is rebuilt from five years of daily bars
# every run, which Yahoo serves in full, so nothing needs remembering and the
# build no longer writes to the repository at all.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue the newest and let it win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Pages URLs
        id: paths
        run: |
          set -euo pipefail
          # From github.repository ("owner/repo"), which is present on every
          # event type — unlike github.event.repository, which depends on the
          # webhook payload and is not guaranteed on a schedule trigger.
          repo='${{ github.repository }}'
          repo=${repo#*/}
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')

          # A repository named <owner>.github.io is a user/organisation page and
          # is served from the domain root. Everything else is a project page
          # served from /<repo>, so assets and routes need that prefix.
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$repo" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$owner.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.site_url }}
        run: npm run build

      # `_next/` starts with an underscore, which Jekyll would strip.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If this step fails with a 404 or "not accessible", Pages has not been
      # enabled yet — see the note at the top of this file.
      - id: deployment
        uses: actions/deploy-pages@v4
