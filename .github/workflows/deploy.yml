name: Deploy to GitHub Pages

# ONE-TIME SETUP REQUIRED
#
# Before the first successful run, enable Pages by hand:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# This cannot be automated from here. `actions/configure-pages` has an
# `enablement: true` option that calls the Pages API to create the site, but
# the workflow's automatic GITHUB_TOKEN is not permitted to do that — it fails
# with "Resource not accessible by integration". Creating a Pages site needs
# repository-administration rights that the automatic token deliberately does
# not have. So the site is created once by a human, and every deploy after that
# is automatic.
#
# Nothing below calls the Pages API for configuration: the base path is derived
# from the repository name, so the build never depends on that API being
# reachable or the token being privileged.

on:
  push:
    branches: [main]
  # Two things go stale in a static export and both are fixed by rebuilding.
  #
  # Calendar-derived copy — years of experience, the copyright line — is
  # computed at build time by `src/lib/time.ts` and freezes at the moment of
  # the build.
  #
  # Market data is the reason this is DAILY rather than monthly: the scheduled
  # run refetches prices, SEC fundamentals and macro, and appends what cannot be
  # re-fetched later to the archive. 22:30 UTC is after the US close and its
  # settlement, so it picks up a finished session rather than a partial one.
  schedule:
    - cron: '30 22 * * 1-5'
  # Lets you publish a build by hand from the Actions tab.
  workflow_dispatch:

# `contents: write` so the nightly run can push the archive back.
#
# Three of the four data sources destroy history. Yahoo purges delisted symbols
# outright — eight were tested and all eight 404 — so a holding that gets
# acquired takes its entire price history with it. The constituent list only
# ever describes today, which is exactly why survivorship cannot be fixed
# retroactively but can be fixed going forward. XBRL restatements overwrite.
#
# None of that is recoverable later, so the run writes what it saw to `archive/`
# and commits it. The alternative is discovering in 2031 that the five years of
# point-in-time index membership we could have had for 30 KB a week does not
# exist.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once; queue the newest and let it win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, because the archive step may have to rebase.
      # `actions/checkout` defaults to a depth of 1, and `git pull --rebase` on a
      # shallow clone fails — which would turn a routine race with another push
      # into a lost day of archive.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Pages URLs
        id: paths
        run: |
          set -euo pipefail
          # From github.repository ("owner/repo"), which is present on every
          # event type — unlike github.event.repository, which depends on the
          # webhook payload and is not guaranteed on a schedule trigger.
          repo='${{ github.repository }}'
          repo=${repo#*/}
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')

          # A repository named <owner>.github.io is a user/organisation page and
          # is served from the domain root. Everything else is a project page
          # served from /<repo>, so assets and routes need that prefix.
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$repo" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$owner.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      # The heavy fetch runs on a SCHEDULE, not on every push.
      #
      # Prices, fundamentals and macro are about 2,100 requests across Yahoo and
      # the SEC — roughly eight minutes, and a volume of traffic worth spacing
      # out rather than firing every time somebody edits a paragraph. Yahoo
      # throttles by IP and GitHub runners share them.
      #
      # A push-triggered build skips this and uses whatever is committed, which
      # is correct: the site renders from the archive and from published
      # results, never from a live fetch.
      - name: Refresh engine data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run data:all

      # The archive only grows if somebody keeps it.
      #
      # "Refresh engine data" above has fetched today's prices, fundamentals and
      # macro into `data/`, which is gitignored and thrown away with the runner.
      # This promotes the parts that cannot be re-fetched later into `archive/`
      # and commits them.
      #
      # `[skip ci]` matters: the push would otherwise retrigger this workflow and
      # it would sit rebuilding itself.
      - name: Keep the archive
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          npm run archive

          # `git diff --quiet` is the right test here rather than counting rows.
          # The archive is append-only and idempotent — a run that fetched
          # nothing new leaves every file byte-identical, so an empty diff
          # genuinely means there was nothing to keep.
          if git diff --quiet -- archive; then
            echo "nothing new to keep"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive
          git commit -m "chore: extend the archive [skip ci]"

          # Keeping the archive must never cost a deploy. If main moved while
          # this build was running, rebase once and retry; if it still will not
          # go, say so and carry on — today's rows are re-fetchable tomorrow and
          # a published site is not.
          git push || {
            git pull --rebase --autostash origin main && git push
          } || echo "::warning::archive push failed; the site still deploys"

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.site_url }}
        run: npm run build

      # `_next/` starts with an underscore, which Jekyll would strip.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If this step fails with a 404 or "not accessible", Pages has not been
      # enabled yet — see the note at the top of this file.
      - id: deployment
        uses: actions/deploy-pages@v4
